<style>
  body { background: linear-gradient(180deg, #070e1a 0%, #0a1628 100%) !important; min-height: 100vh; }
  .toc-container { max-width: 640px; margin: 0 auto; padding: 60px 24px 40px; }
  .toc-title { text-align: center; font-family: "Georgia", "Noto Serif SC", "STSong", serif; font-size: 28px; color: rgba(255,255,255,0.9); letter-spacing: 0.5em; margin-bottom: 16px; }
  .toc-divider { width: 60px; height: 1px; background: rgba(255,255,255,0.2); margin: 0 auto 40px; }
  .toc-row { display: flex; align-items: baseline; line-height: 2.5; padding: 4px 12px; border-radius: 6px; cursor: pointer; transition: background 0.2s; position: relative; }
  .toc-row:hover { background: rgba(255,255,255,0.05); }
  .toc-num { flex-shrink: 0; width: 36px; color: rgba(255,255,255,0.4); font-size: 15px; font-family: "Georgia",serif; }
  .toc-title-text { flex-shrink: 0; color: rgba(255,255,255,0.9); font-size: 16px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc-row:hover .toc-title-text { color: #fff; }
  .toc-dots { flex: 1; min-width: 20px; height: 1em; margin: 0 8px; border-bottom: 1px dotted rgba(255,255,255,0.15); align-self: flex-end; margin-bottom: 0.35em; }
  .toc-chapter { flex-shrink: 0; color: rgba(255,255,255,0.5); font-size: 12px; }
  .toc-actions { display: none; gap: 4px; margin-left: 8px; flex-shrink: 0; }
  .toc-row:hover .toc-actions { display: flex; }
  .toc-act-btn { background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; padding: 2px 6px; font-size: 14px; border-radius: 4px; transition: all 0.15s; }
  .toc-act-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .toc-act-btn.danger:hover { color: var(--color-danger); }
  .toc-empty { text-align: center; padding: 80px 20px; color: rgba(255,255,255,0.35); font-size: 15px; line-height: 2; }
  .toc-add-btn { display: block; margin: 40px auto 0; background: none; border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); padding: 10px 40px; border-radius: 20px; font-size: 14px; cursor: pointer; font-family: var(--font-family); transition: all 0.2s; letter-spacing: 2px; }
  .toc-add-btn:hover { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.04); }
  #reader-view { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 5; }
  #reader-view.show { display: flex; }
  /* 阅读器暗色主题 */
  .reader-scene { position: fixed; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #070e1a 0%, #0a1628 100%); }
  .reader-topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; backdrop-filter: blur(var(--blur-glass)); background: rgba(10,20,40,0.8); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10; }
  .reader-back-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 14px; font-family: var(--font-family); padding: 4px 8px; border-radius: var(--radius-sm); transition: color 0.2s; }
  .reader-back-btn:hover { color: rgba(255,255,255,0.9); }
  .reader-title { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.9); }
  .reader-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  .book-page { width: 100%; max-width: 620px; min-height: 70vh; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px 14px 14px 4px; padding: 40px 36px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); position: relative; color: rgba(255,255,255,0.85); font-size: 16px; line-height: 2; }
  .book-page::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 28px; background: linear-gradient(90deg, rgba(255,255,255,0.03), transparent); border-right: 1px solid rgba(255,255,255,0.06); border-radius: 4px 0 0 14px; }
  .book-page-inner { margin-left: 16px; user-select: text; }
  .book-page-inner p { text-indent: 2em; margin-bottom: 12px; }
  .page-nav { display: flex; align-items: center; gap: 16px; margin-top: 20px; padding-bottom: 30px; }
  .page-nav-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .page-nav-btn:hover:not(:disabled) { border-color: rgba(79,217,200,0.4); box-shadow: 0 0 12px rgba(79,217,200,0.2); color: #fff; }
  .page-nav-btn:disabled { opacity: 0.2; cursor: default; }
  .page-indicator { font-size: 14px; color: rgba(255,255,255,0.5); min-width: 60px; text-align: center; }

  /* 新建故事内联编辑 — 外观和阅读模式一致 */
  .new-story-title { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.9); line-height: 1.5; outline: none; margin-bottom: 28px; min-height: 1.2em; }
  .new-story-title:empty::before { content: '故事标题'; color: rgba(255,255,255,0.18); pointer-events: none; }
  .new-story-body { font-size: 16px; line-height: 2; color: rgba(255,255,255,0.85); outline: none; min-height: 50vh; }
  .new-story-body:empty::before { content: '开始写故事...'; color: rgba(255,255,255,0.18); pointer-events: none; }
  @media (max-width: 600px) {
    .toc-container { padding: 40px 16px 30px; }
    .toc-title { font-size: 22px; }
    .book-page { padding: 24px 16px; font-size: 14px; }
    .book-page-inner { margin-left: 8px; }
  }
</style>
