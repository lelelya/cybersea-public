<style>
  /* 记账本样式 - 深海半透明毛玻璃质感 */
  :root {
    color-scheme: dark; /* 强制暗色模式，防止日期选择器出现白底 */
  }

  

  .ledger-container {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    gap: 20px;
    padding-bottom: 100px; /* 留出底部浮动按钮空间 */
  }

  /* SVG图标样式定义 (极细荧光青单线条) */
  .type-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid var(--color-primary-soft);
    background: var(--color-surface-translucent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }

  .type-icon svg {
    width: 24px;
    height: 24px;
    stroke: var(--color-primary); /* 荧光青 */
    stroke-width: 1.2; /* 极细 */
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 4px var(--color-primary-soft));
  }

  /* 月度账单头部统计 */
  .ledger-month-header {
    background: var(--color-surface-translucent-strong);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--color-primary-soft);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow-soft);
  }

  .ledger-month-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .ledger-month-btn {
    background: var(--color-primary-soft);
    border: 1px solid var(--color-primary-soft);
    border-radius: 8px;
    color: var(--color-primary);
    cursor: pointer;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .ledger-month-btn:active {
    background: var(--color-primary-soft);
  }

  .ledger-month-title {
    font-weight: 400;
    font-size: 18px;
    color: var(--color-text);
    letter-spacing: 1px;
  }

  .ledger-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding-top: 16px;
    border-top: 1px solid var(--color-primary-soft);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stat-item:last-child { align-items: flex-end; }
  .stat-item:nth-child(2) { align-items: center; }

  .stat-label {
    font-size: 12px;
    color: var(--color-text-muted);
  }

  .stat-value {
    font-size: 18px;
    font-weight: 300;
    font-family: monospace;
  }

  .val-income { color: var(--color-primary); text-shadow: 0 0 6px var(--color-primary-soft); }
  .val-expense { color: var(--color-danger); text-shadow: 0 0 6px var(--color-danger-soft); }
  .val-balance { color: var(--color-text); }

  /* 记录列表 — 细线分隔 */
  .ledger-entry-item {
    display: flex;
    align-items: center;
    padding: 12px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
  }
  .ledger-entry-item:last-child { border-bottom: none; }

  .entry-main {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .entry-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .entry-name {
    font-size: 16px;
    color: var(--color-text);
    font-weight: 300;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-date {
    font-size: 12px;
    color: var(--color-text-muted);
  }

  .entry-amount {
    font-size: 18px;
    font-weight: 300;
    font-family: monospace;
    flex-shrink: 0;
  }

  .entry-more-btn {
    color: var(--color-text-muted);
    cursor: pointer;
    padding: 8px;
    margin-left: 8px;
    user-select: none;
  }

  .entry-more-dropdown {
    position: absolute;
    right: 4px;
    top: 40px;
    background: var(--color-surface-translucent-strong);
    backdrop-filter: blur(12px);
    border: 1px solid var(--color-primary-soft);
    border-radius: 8px;
    padding: 6px;
    display: none;
    z-index: 10;
    box-shadow: var(--shadow-soft);
  }

  .entry-more-dropdown.show { display: block; }

  /* 悬浮添加按钮 */
  .fab-add {
    position: fixed;
    bottom: calc(84px + env(safe-area-inset-bottom));
    right: 106px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--color-surface-translucent-strong);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--color-primary-soft);
    color: var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px var(--color-primary-soft), inset 0 0 12px var(--color-primary-soft);
    cursor: pointer;
    z-index: 20;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .fab-add:active { transform: scale(0.9); }
  .fab-add svg {
    filter: drop-shadow(0 0 6px var(--color-primary-soft));
  }

  /* 模态框深海风格 */
  .modal-card {
    background: var(--color-surface-translucent-strong) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border: 1px solid var(--color-primary-soft);
    box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 24px;
    color: var(--color-text);
  }

  .modal-input {
    background: var(--color-surface) !important;
    border: 1px solid var(--color-primary-soft) !important;
    color: var(--color-primary) !important;
    border-radius: 12px;
    font-family: inherit;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .modal-input:focus {
    outline: none;
    border-color: var(--color-primary) !important;
    box-shadow: 0 0 12px var(--color-primary-soft);
  }

  /* 类别选择器网格 */
  .type-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px 12px;
    margin-top: 16px;
    margin-bottom: 24px;
  }

  .type-option {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    opacity: 0.4;
    transition: all 0.3s;
  }

  .type-option.selected {
    opacity: 1;
    transform: translateY(-2px);
  }

  .type-option.selected .type-icon {
    border-color: var(--color-primary);
    background: var(--color-primary-soft);
    box-shadow: 0 0 16px var(--color-primary-soft);
  }

  .type-label {
    font-size: 12px;
    color: var(--color-text);
    font-weight: 300;
  }

  /* 类型切换（支出/收入 — 模态框内） */
  .type-tabs {
    display: flex;
    background: var(--color-surface);
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 20px;
    border: 1px solid var(--color-primary-soft);
  }

  .type-tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    color: var(--color-text-muted);
    transition: all 0.3s;
  }

  .type-tab.active {
    background: var(--color-primary-soft);
    color: var(--color-primary);
    box-shadow: 0 0 10px var(--color-primary-soft);
  }

  /* 按天分组 */
  .day-group {
    margin-bottom: 8px;
  }

  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 8px 8px 8px;
    margin-top: 4px;
  }

  .day-header-date {
    font-size: 14px;
    color: var(--color-text);
    font-weight: 300;
    letter-spacing: 1px;
  }

  .day-header-stats {
    font-size: 12px;
    font-family: monospace;
    display: flex;
    gap: 10px;
  }

  /* 每日批注自动展示 */
  .day-annotation {
    font-style: italic;
    color: var(--color-text-muted);
    opacity: 0.65;
    font-size: 13px;
    padding: 10px 16px;
    line-height: 1.7;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 4px 8px;
    border-left: 2px solid var(--color-primary-soft);
    border-radius: 0 8px 8px 0;
    background: rgba(0, 0, 0, 0.1);
  }

  .day-annotation svg {
    flex-shrink: 0;
    margin-top: 2px;
    stroke: var(--color-primary);
    opacity: 0.5;
  }

  /* 每日批注生成按钮 */
  .day-gen-row {
    text-align: right;
    padding: 4px 8px 4px 8px;
  }

  .day-gen-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--color-text-muted);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.4;
    transition: all 0.3s;
    font-family: inherit;
  }

  .day-gen-btn:hover {
    opacity: 1;
    color: var(--color-primary);
    border-color: var(--color-primary-soft);
  }

  .day-gen-btn:disabled {
    opacity: 0.2;
    cursor: not-allowed;
  }

  /* 日期选择器 */
  .day-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 0;
  }

  .day-nav-btn {
    background: var(--color-primary-soft);
    border: 1px solid var(--color-primary-soft);
    border-radius: 8px;
    color: var(--color-primary);
    cursor: pointer;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .day-nav-btn:active {
    background: var(--color-primary-soft);
    transform: scale(0.95);
  }

  .day-picker-input {
    background: var(--color-surface-translucent);
    border: 1px solid var(--color-primary-soft);
    border-radius: 10px;
    color: var(--color-primary);
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 300;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    color-scheme: dark;
  }

  .day-picker-input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 12px var(--color-primary-soft);
  }

  .day-picker-input::-webkit-calendar-picker-indicator {
    filter: invert(1) opacity(0.6);
    cursor: pointer;
  }

  .btn-outline-primary {
    border: 1px solid var(--color-primary-soft);
    background: var(--color-primary-soft);
    color: var(--color-primary);
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.3s;
  }

  .btn-outline-primary:hover {
    background: var(--color-primary-soft);
    box-shadow: 0 0 12px var(--color-primary-soft);
  }

  .btn-outline-primary:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--color-primary-soft);
    border: 1px solid var(--color-primary);
    color: var(--color-primary);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    text-shadow: 0 0 4px var(--color-primary-soft);
    box-shadow: 0 0 12px var(--color-primary-soft);
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

</style>

  </div>

  <button class="fab-add" id="fab-add-btn">
    <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>

  <div class="modal-overlay" id="add-modal" style="display:none;">
    <div class="modal-card" style="width:90%; max-width:400px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 class="modal-title" style="margin:0; font-weight: 300; font-size: 18px;">记一笔</h3>
        <button id="close-add-modal" style="background:none;border:none;color:var(--color-text-muted);cursor:pointer;font-size:24px; font-weight:300;">&times;</button>
      </div>

      <div class="type-tabs">
        <div class="type-tab active" data-type="expense">支出</div>
        <div class="type-tab" data-type="income">收入</div>
      </div>

      <!-- 支出类型网格 -->
      <div class="type-grid" id="expense-types">
        <!-- JS 动态生成 -->
      </div>

      <!-- 收入类型网格 -->
      <div class="type-grid" id="income-types" style="display:none;">
        <!-- JS 动态生成 -->
      </div>

      <div class="form-field" style="margin-bottom: 16px;">
        <label style="color: var(--color-text-muted); font-size: 13px; margin-bottom: 8px; display:block;">金额</label>
        <input type="number" id="new-amount" step="0.01" min="0" class="modal-input" placeholder="0.00" style="width:100%; box-sizing:border-box; font-size:28px; font-weight:300; padding:12px 16px;" />
      </div>
      <div class="form-field" style="margin-bottom: 16px;">
        <label style="color: var(--color-text-muted); font-size: 13px; margin-bottom: 8px; display:block;">备注</label>
        <input type="text" id="new-note" placeholder="例如：午饭" class="modal-input" style="width:100%; box-sizing:border-box; padding:12px 16px; font-size:15px;" />
      </div>
      <div class="form-field" style="margin-bottom: 24px;">
        <label style="color: var(--color-text-muted); font-size: 13px; margin-bottom: 8px; display:block;">日期</label>
        <input type="date" id="new-date" class="modal-input" style="width:100%; box-sizing:border-box; padding:12px 16px; font-size:15px;" />
      </div>
      <div>
        <button class="btn-primary" id="add-btn" style="width:100%; padding:14px; font-size:16px; letter-spacing:2px;">记录</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/ledger.js"></script>
  <script src="js/nav.js?v=6"></script>
  <script src="js/octopus-widget.js"></script>
<script src="js/deepsea-particles.js"></script>
  
</body>
</html>
