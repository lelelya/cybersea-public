<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('cybersea_theme')||'deep-sea')</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>聊天记录搜索</title>
  <script src="js/shared.js"></script>
<script src="js/bgm-player.js"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/effects.css" />
<style>
  .sh-page {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sh-topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--color-surface-translucent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--color-border);
  }
  .sh-back-btn {
    background: none; border: none; color: var(--color-text);
    cursor: pointer; padding: 4px; display: flex; align-items: center;
  }
  .sh-back-btn svg { width: 24px; height: 24px; stroke: currentColor; }
  .sh-search-input {
    flex: 1;
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    color: var(--color-text);
    font-size: 14px;
    font-family: var(--font-family);
    outline: none;
  }
  .sh-search-input:focus { border-color: var(--color-primary); }
  .sh-search-input::placeholder { color: var(--color-text-muted); }

  .sh-results {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .sh-empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 60px 20px;
    color: var(--color-text-muted); gap: 8px; text-align: center;
  }
  .sh-result-card {
    background: var(--color-surface-translucent);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sh-result-card:hover {
    border-color: var(--color-primary);
    box-shadow: var(--shadow-softer);
  }
  .sh-result-role {
    font-size: 12px; font-weight: 600; margin-bottom: 6px;
  }
  .sh-result-role.user { color: var(--color-primary); }
  .sh-result-role.ai { color: var(--color-accent); }
  .sh-result-content {
    font-size: 14px; color: var(--color-text); line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
    max-height: 120px; overflow: hidden;
  }
  .sh-result-content.expanded { max-height: none; }
  .sh-result-time {
    font-size: 11px; color: var(--color-text-muted); margin-top: 8px;
  }
  .sh-result-expand {
    font-size: 12px; color: var(--color-primary); cursor: pointer;
    margin-top: 4px; display: inline-block;
  }
  .sh-highlight { background: rgba(79,217,200,0.25); border-radius: 2px; padding: 0 2px; }
</style>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#050a14" />
  <link rel="stylesheet" href="css/design-system.css?v=2">
</head>
<body>
  <div class="topbar">
    <button class="sh-back-btn" onclick="history.back()" title="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <div class="title">聊天记录搜索</div>
  </div>
  <div class="page-toolbar search-toolbar">
    <input type="text" class="sh-search-input" id="sh-input" aria-label="搜索聊天记录" placeholder="输入关键词搜索聊天记录..." autofocus />
  </div>

  <div class="sh-page">
    <div class="sh-results" id="sh-results">
      <div class="sh-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" width="48" height="48" opacity="0.3"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <div style="font-size:15px;">输入关键词搜索聊天记录</div>
      </div>
    </div>
  </div>

  <script src="js/searchHistory.js"></script>
  <script src="js/nav.js?v=6"></script>
</body>
</html>
