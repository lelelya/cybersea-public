<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆 · CyberSea</title>
<script>document.documentElement.setAttribute('data-theme','deep-sea')</script>
<script src="js/shared.js"></script><script src="js/bgm-player.js"></script>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/effects.css"><link rel="stylesheet" href="css/design-system.css?v=2"><link rel="stylesheet" href="css/memory-bank.css?v=3">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#050a14"></head>
<body class="memory-page" data-memory-hidden="true">
<header class="topbar"><button id="menu-btn" class="menu-btn" aria-label="导航"></button><div class="title">记忆</div><button type="button" class="memory-icon memory-privacy-toggle" data-memory-privacy aria-label="显示记忆内容" aria-pressed="false" title="显示记忆内容"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="m3 3 18 18"/></svg></button><button id="memory-settings" class="memory-icon" aria-label="记忆设置" title="记忆设置"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 2-1 3 2 3-2 2 1 3-2-1-3 2-2-2-3-3-1-1-3Z"/></svg></button></header>
<nav class="memory-tabs" role="tablist" aria-label="记忆分类"><button class="memory-tab" id="tab-profile" role="tab" aria-controls="view-profile" aria-selected="true" data-tab="profile">关系画像</button><button class="memory-tab" id="tab-milestones" role="tab" aria-controls="view-milestones" aria-selected="false" data-tab="milestones">感情进展</button><button class="memory-tab" id="tab-events" role="tab" aria-controls="view-events" aria-selected="false" data-tab="events">事件记录</button></nav>
<div class="memory-scroll" tabindex="0" role="region" aria-label="记忆内容"><main class="memory-shell"><p class="memory-privacy-hint" role="status">内容已隐藏，点击小眼睛显示</p><div class="memory-status"><span id="memory-status" aria-live="polite">正在读取记忆…</span><button class="memory-link" id="memory-history">查看变化</button></div>
<section id="view-profile" role="tabpanel" aria-labelledby="tab-profile"><div class="memory-actions"><button class="memory-link" id="edit-all-profile">编辑全部画像</button><button class="memory-link" id="pending-changes">修改建议</button></div><div id="profile-sections"></div></section>
<section id="view-milestones" role="tabpanel" aria-labelledby="tab-milestones" hidden><div class="memory-actions"><button class="btn-ghost" id="milestone-add-btn">新增节点</button></div><div id="milestones-list"></div></section>
<section id="view-events" role="tabpanel" aria-labelledby="tab-events" hidden><form class="memory-toolbar" id="event-search-form" data-memory-private-form inert><input id="event-query" type="search" placeholder="搜索过去发生的事" aria-label="搜索记忆事件"><button class="btn-ghost" type="submit">搜索</button></form><div class="memory-toolbar"><select id="event-mode" aria-label="浏览方式"><option value="recent">最近记录</option><option value="date">按日期</option></select><div id="event-date-controls" data-memory-private-form inert hidden><button class="memory-icon" id="prev-day" aria-label="前一天">‹</button><input type="date" id="event-date-picker" aria-label="筛选日期"><button class="memory-icon" id="next-day" aria-label="后一天">›</button></div><button class="memory-link" id="event-add-btn">新增记录</button></div><div id="events-list"></div><button class="memory-link" id="events-more" hidden>加载更多</button></section>
</main></div>
<dialog id="memory-panel" class="memory-panel"><div class="panel-head"><h2 id="panel-title">记忆设置</h2><div class="memory-dialog-actions"><button type="button" class="memory-icon memory-privacy-toggle" data-memory-privacy aria-label="显示记忆内容" aria-pressed="false" title="显示记忆内容"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="m3 3 18 18"/></svg></button><button class="memory-icon" data-close="memory-panel" aria-label="关闭">×</button></div></div><div class="panel-body" id="panel-content"></div></dialog>
<dialog id="memory-detail" class="memory-modal"><div class="panel-head"><h2 id="detail-title">记忆详情</h2><div class="memory-dialog-actions"><button type="button" class="memory-icon memory-privacy-toggle" data-memory-privacy aria-label="显示记忆内容" aria-pressed="false" title="显示记忆内容"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="m3 3 18 18"/></svg></button><button class="memory-icon" data-close="memory-detail" aria-label="关闭详情">×</button></div></div><div class="panel-body" id="detail-content"></div></dialog>
<input type="file" id="import-input" accept="application/json" hidden><div class="toast" id="toast" role="status"></div>
<script src="js/memoryBank.js?v=2"></script><script src="js/nav.js?v=6"></script><script src="js/octopus-widget.js"></script><script src="js/deepsea-particles.js"></script>
</body></html>
