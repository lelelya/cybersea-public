  <div class="plan-tabs">
    <button class="plan-tab active" data-category="mine">我的计划</button>
    <button class="plan-tab" data-category="his">他的计划</button>
    <button class="plan-tab" data-category="shared">共同计划</button>
  </div>

  <!-- 单横线笔记本内容区 -->
  <div class="plan-notebook" id="plan-content"></div>

  <!-- 右下角 + 浮动按钮 -->
  <button class="plan-fab" id="fab-btn" title="新建计划">
    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- 新建计划弹窗 -->
  <div id="create-modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="width:340px;">
      <h3 class="modal-title">新建计划</h3>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <input type="text" id="modal-content" class="plan-modal-input" placeholder="写一条新计划…" />
        <div style="display:flex;gap:10px;">
          <select id="modal-category" class="plan-modal-select">
            <option value="mine">我的计划</option>
            <option value="his">他的计划</option>
            <option value="shared">共同计划</option>
          </select>
          <select id="modal-creator" class="plan-modal-select">
            <option value="user">我写的</option>
            <option value="ai">AI写的</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary btn-sm" id="modal-cancel">取消</button>
        <button class="btn-primary btn-sm" id="modal-confirm">添加</button>
      </div>
