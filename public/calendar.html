<style>
body { background: var(--color-bg-top); min-height: 100vh; overflow-x: hidden; }
.cal-scene { width: min(900px, 90vw); margin: 0 auto; padding: 56px 16px 20px; min-height: calc(100vh - 20px); display: flex; flex-direction: column; }
.cal-tabs { display: flex; gap: 24px; margin-bottom: 18px; border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
.cal-tab { border: none; background: none; padding: 10px 2px 12px; font-size: 15px; color: var(--color-text-muted); cursor: pointer; font-family: var(--font-family); position: relative; transition: color 0.25s ease; }
.cal-tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--color-primary); box-shadow: var(--shadow-glow-primary); transform: scaleX(0); transition: transform 0.25s ease; }
.cal-tab.active { color: var(--color-primary); }
.cal-tab.active::after { transform: scaleX(1); }

#cal-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.cal-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; flex-shrink: 0; }
.cal-header-btn { background: none; border: none; color: var(--color-text-muted); cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); font-size: 18px; }
.cal-header-btn:hover { color: var(--color-text); }
.cal-header-date { font-size: 16px; font-weight: 600; color: var(--color-text); min-width: 140px; text-align: center; }

/* Day view: single column */
.day-layout { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
.day-timeline { flex: 2; overflow-y: auto; min-height: 80px; padding-right: 4px; }
.day-todos { flex: 1; overflow-y: auto; min-height: 100px; border-top: 1px solid var(--color-border); padding-top: 12px; }
.event-item { padding: 10px 14px; margin-bottom: 6px; background: var(--color-surface-translucent); backdrop-filter: blur(8px); border: 1px solid var(--color-border); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; }
.event-item:hover { border-color: var(--color-border-glow); }
.event-time { font-size: 12px; color: var(--color-primary); margin-bottom: 2px; }
.event-title { font-size: 14px; color: var(--color-text); font-weight: 500; }
.event-note { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
.event-empty, .cal-empty { text-align: center; padding: 40px 20px; color: var(--color-text-muted); font-size: 14px; }

/* Week view */
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; flex: 2; min-height: 200px; overflow-y: auto; }
.week-col { background: var(--color-surface-translucent); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 6px 4px; display: flex; flex-direction: column; overflow-y: auto; }
.week-col.today { border-color: var(--color-border-glow); }
.week-day-label { font-size: 11px; color: var(--color-text-muted); text-align: center; flex-shrink: 0; }
.week-day-num { font-size: 14px; font-weight: 600; color: var(--color-text); text-align: center; margin-bottom: 6px; flex-shrink: 0; }
.week-col.today .week-day-num { color: var(--color-primary); }
.week-event { padding: 3px 6px; margin-bottom: 2px; background: rgba(79,217,200,0.1); border-radius: 3px; cursor: pointer; font-size: 11px; color: var(--color-text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex-shrink: 0; }
.week-event:hover { background: rgba(79,217,200,0.2); }

/* Month view */
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; flex: 2; min-height: 200px; overflow-y: auto; }
.month-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: var(--radius-sm); font-size: 13px; color: var(--color-text); transition: background 0.15s; max-height: 48px; }
.month-cell:hover { background: rgba(255,255,255,0.05); }
.month-cell.today { color: var(--color-primary); font-weight: 700; }
.month-cell.other-month { color: rgba(255,255,255,0.15); }
.month-weekday { text-align: center; font-size: 12px; color: var(--color-text-muted); padding: 8px 0; }

/* Todo section (week/month views) */
.todo-section { margin-top: 12px; flex: 1; min-height: 100px; overflow-y: auto; border-top: 1px solid var(--color-border); padding-top: 12px; }
.todo-section-title { font-size: 13px; color: var(--color-text-muted); margin-bottom: 8px; font-weight: 600; }
.todo-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s; }
.todo-item:hover { background: rgba(255,255,255,0.03); }
.todo-check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--color-border-strong); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; transition: all 0.2s; }
.todo-item.done .todo-check { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-text-on-primary); }
.todo-item.done .todo-title { text-decoration: line-through; color: var(--color-text-muted); }
.todo-title { font-size: 13px; color: var(--color-text); flex: 1; }
.todo-del { opacity: 0; background: none; border: none; color: var(--color-danger); cursor: pointer; font-size: 12px; padding: 2px 4px; }
.todo-item:hover .todo-del { opacity: 1; }
.todo-add-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.todo-add-input { flex: 1; min-width: 120px; background: rgba(255,255,255,0.04); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text); padding: 6px 10px; font-size: 13px; font-family: var(--font-family); outline: none; }
.todo-add-input:focus { border-color: var(--color-border-glow); }
.todo-add-date { width: 110px; flex-shrink: 0; background: rgba(255,255,255,0.04); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text); padding: 5px 6px; font-size: 12px; font-family: var(--font-family); outline: none; }
.todo-add-date:focus { border-color: var(--color-border-glow); }
.todo-add-btn { background: none; border: 1px solid var(--color-border); color: var(--color-text-muted); cursor: pointer; padding: 6px 12px; border-radius: var(--radius-sm); font-size: 13px; white-space: nowrap; }
.todo-add-btn:hover { border-color: var(--color-border-glow); color: var(--color-text); }
.todo-date-range { font-size: 11px; color: var(--color-text-muted); margin-left: 4px; }

.detail-panel { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--color-surface-translucent-strong); backdrop-filter: blur(20px); border-top: 1px solid var(--color-border-strong); border-radius: 16px 16px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); max-height: 60vh; overflow-y: auto; }
.detail-panel.show { transform: translateY(0); }
.detail-overlay { position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,0.4); display: none; }
.detail-overlay.show { display: block; }
.detail-field { margin-bottom: 12px; }
.detail-label { font-size: 12px; color: var(--color-text-muted); margin-bottom: 4px; }
.detail-value { font-size: 15px; color: var(--color-text); }
.detail-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text); padding: 8px 12px; font-size: 14px; font-family: var(--font-family); outline: none; box-sizing: border-box; }
.detail-input:focus { border-color: var(--color-border-glow); }
.detail-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
.detail-btn { padding: 8px 20px; border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; font-family: var(--font-family); background: none; border: 1px solid var(--color-border); color: var(--color-text-muted); }
.detail-btn.primary { background: var(--color-primary-soft); border-color: var(--color-border-glow); color: var(--color-primary); }
.detail-btn.danger { background: var(--color-danger-soft); border-color: transparent; color: var(--color-danger); }

.toggle-row { display: flex; align-items: center; gap: 8px; }
.toggle-sw { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle-sw input { opacity: 0; width: 0; height: 0; }
.toggle-sw .tslider { position: absolute; inset: 0; background: rgba(255,255,255,0.1); border-radius: 11px; cursor: pointer; transition: 0.2s; }
.toggle-sw .tslider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: 0.2s; }
.toggle-sw input:checked + .tslider { background: var(--color-primary); }
.toggle-sw input:checked + .tslider::before { transform: translateX(18px); }

.add-event-btn { position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px; border-radius: 50%; background: var(--color-primary); color: var(--color-text-on-primary); border: none; font-size: 24px; cursor: pointer; box-shadow: var(--shadow-glow-primary); z-index: 20; display: flex; align-items: center; justify-content: center; }

@media (max-width: 600px) {
  .cal-scene { width: 100%; padding: 50px 10px 16px; }
  .day-timeline { min-height: 60px; }
  .day-todos { min-height: 80px; }
  .week-grid { min-height: 160px; }
  .month-grid { min-height: 160px; }
  .week-event { font-size: 10px; padding: 2px 3px; }
  .month-cell { font-size: 11px; max-height: 36px; }
  .todo-section { min-height: 80px; }
  .add-event-btn { bottom: 16px; right: 16px; width: 44px; height: 44px; font-size: 22px; }
}
