  <div class="form-container album-container">

    <!-- 顶部：我的相册/他的相册 切换 -->
    <div class="album-tabs">
      <button class="album-tab active" id="tab-user" data-owner="user">我的相册</button>
      <button class="album-tab" id="tab-ai" data-owner="ai">他的相册</button>
    </div>

    <!-- 我的相册 -->
    <div class="album-owner-panel" id="user-panel">

      <!-- 文件夹列表视图 -->
      <div class="album-list-view" id="user-list-view">
        <div class="album-list-header">
          <h3 class="album-section-title">相册文件夹</h3>
          <button class="btn-icon-add" id="user-add-folder-btn" title="新建相册">+</button>
        </div>
        <div class="folder-grid" id="user-folder-grid"></div>
        <div class="album-empty-state" id="user-folder-empty" style="display:none;">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <circle cx="9" cy="9" r="1.8"></circle>
            <path d="M21 15l-5-5-9 9"></path>
          </svg>
          <div class="album-empty-text">这里还静悄悄的<br/>创建第一个相册吧</div>
        </div>
      </div>

      <!-- 文件夹内详情视图 -->
      <div class="album-folder-view" id="user-folder-view" style="display:none;">
        <div class="album-folder-header">
          <button class="btn-ghost btn-ghost-sm" id="user-back-btn">‹ 返回</button>
          <h3 class="album-section-title" id="user-folder-title" style="flex:1;"></h3>
          <button class="btn-ghost btn-ghost-sm" id="user-edit-folder-btn" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> 重命名</button>
          <button class="btn-ghost btn-ghost-sm" id="user-delete-folder-btn" style="display:none; color:var(--color-danger); border-color:var(--color-danger-soft);">删除相册</button>
        </div>

        <div class="upload-dropzone" id="user-upload-zone">
          <input type="file" id="user-upload-input" accept="image/*" class="upload-dropzone-input" />
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"></path>
            <path d="M6.5 9.5L12 4l5.5 5.5"></path>
            <path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"></path>
          </svg>
          <div>点击或拖拽上传照片</div>
        </div>

        <div class="photo-grid" id="user-photo-grid"></div>
      </div>
    </div>

    <!-- 他的相册 -->
    <div class="album-owner-panel" id="ai-panel" style="display:none;">

      <div class="album-list-view" id="ai-list-view">
        <div class="album-list-header">
          <h3 class="album-section-title">相册文件夹</h3>
          <button class="btn-icon-add" id="ai-add-folder-btn" title="新建相册">+</button>
        </div>
        <div class="folder-grid" id="ai-folder-grid"></div>
        <div class="album-empty-state" id="ai-folder-empty" style="display:none;">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <circle cx="9" cy="9" r="1.8"></circle>
            <path d="M21 15l-5-5-9 9"></path>
          </svg>
          <div class="album-empty-text">这里还静悄悄的<br/>创建第一个相册吧</div>
        </div>
      </div>

      <div class="album-folder-view" id="ai-folder-view" style="display:none;">
        <div class="album-folder-header">
          <button class="btn-ghost btn-ghost-sm" id="ai-back-btn">‹ 返回</button>
          <h3 class="album-section-title" id="ai-folder-title" style="flex:1;"></h3>
          <button class="btn-ghost btn-ghost-sm" id="ai-edit-folder-btn" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> 重命名</button>
          <button class="btn-ghost btn-ghost-sm" id="ai-delete-folder-btn" style="display:none; color:var(--color-danger); border-color:var(--color-danger-soft);">删除相册</button>
        </div>

        <div class="memory-hint" style="margin-bottom:10px;">
          这里展示AI主动保存的图片（自己画的/从网上下载的/聊天中保留的），暂不支持手动上传
        </div>

        <div class="photo-grid" id="ai-photo-grid"></div>
      </div>
    </div>
  </div>

  <!-- 新建相册弹窗 -->
  <div class="modal-overlay" id="folder-modal-overlay" style="display:none;">
    <div class="modal-card">
      <h4 class="modal-title" id="folder-modal-title">新建相册</h4>
      <input type="text" id="folder-modal-input" class="modal-input" placeholder="相册名称" maxlength="30" />
      <div class="modal-actions">
        <button class="btn-ghost btn-ghost-sm" id="folder-modal-confirm">创建</button>
        <button class="btn-ghost btn-ghost-sm" id="folder-modal-cancel">取消</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/album.js"></script>
