/* ============================================================
   平行世界模块样式 —— 仅使用 theme.css 中的 CSS 变量
   不修改任何现有样式文件
   ============================================================ */

/* ---------------- 视图切换 ---------------- */
.pw-view { display: none; flex: 1; overflow: hidden; }
.pw-view.active { display: flex; flex-direction: column; }

/* ---------------- 存档列表 ---------------- */
.pw-save-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pw-save-card {
  background: var(--color-surface-translucent);
  backdrop-filter: blur(var(--blur-glass));
  -webkit-backdrop-filter: blur(var(--blur-glass));
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.pw-save-card:hover {
  border-color: var(--color-border-glow);
  box-shadow: var(--shadow-softer);
}

.pw-save-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.pw-save-world {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-primary);
  cursor: text;
  border-radius: 4px;
  padding: 2px 4px;
  margin: -2px -4px;
  transition: background 0.15s;
}
.pw-save-world:hover {
  background: rgba(255,255,255,0.04);
}
.pw-save-world:focus {
  outline: 1px solid var(--color-border-glow);
  background: rgba(255,255,255,0.06);
}
.pw-save-status {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-weight: 600;
}
.pw-save-status.ongoing {
  background: var(--color-primary-soft);
  color: var(--color-primary);
}
.pw-save-status.ended {
  background: var(--color-accent-soft);
  color: var(--color-accent);
}

.pw-save-chars {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-bottom: 6px;
}
.pw-save-preview {
  font-size: 13px;
  color: var(--color-text-muted);
  opacity: 0.7;
  font-style: italic;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.pw-save-meta {
  font-size: 11px;
  color: var(--color-text-muted);
  opacity: 0.5;
  margin-top: 8px;
}
.pw-save-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.pw-save-actions button {
  font-size: 12px;
  padding: 5px 12px;
}

/* ---------------- 空状态 ---------------- */
.pw-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--color-text-muted);
  gap: 12px;
}
.pw-empty svg {
  width: 64px;
  height: 64px;
  opacity: 0.3;
}
.pw-empty p {
  font-size: 15px;
  opacity: 0.6;
}

/* ---------------- 游戏界面 ---------------- */
.pw-game-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* 剧情文本三层次 */
.pw-story-block {
  animation: pwFadeIn 0.4s ease;
}
@keyframes pwFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.pw-narration {
  color: var(--color-text-muted);
  opacity: 0.55;
  font-style: italic;
  line-height: 1.8;
  margin-bottom: 8px;
  font-size: 14px;
}

.pw-his-words {
  color: var(--color-text);
  font-weight: 500;
  line-height: 1.9;
  font-size: 15px;
}

.pw-my-desc {
  color: var(--color-accent);
  opacity: 0.85;
  line-height: 1.8;
  margin-top: 8px;
  font-size: 14px;
}

/* 分隔线 */
.pw-separator {
  border: none;
  border-top: 1px solid var(--color-border);
  opacity: 0.4;
  margin: 4px 0;
}

/* ---------------- 选项面板 ---------------- */
.pw-choice-panel {
  padding: 12px 16px 16px;
  background: var(--color-surface-translucent);
  backdrop-filter: blur(var(--blur-glass));
  -webkit-backdrop-filter: blur(var(--blur-glass));
  border-top: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pw-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pw-option-btn {
  flex: 1;
  min-width: 120px;
  padding: 10px 14px;
  font-size: 14px;
  background: var(--color-primary-soft);
  color: var(--color-primary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-family);
  text-align: center;
}
.pw-option-btn:hover {
  background: rgba(79, 217, 200, 0.25);
  border-color: var(--color-border-glow);
  box-shadow: var(--shadow-glow-primary);
}

.pw-free-input-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.pw-free-input {
  flex: 1;
  padding: 10px 14px;
  font-size: 14px;
  background: rgba(240, 248, 255, 0.06);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text);
  font-family: var(--font-family);
  outline: none;
  transition: border-color 0.2s;
}
.pw-free-input:focus {
  border-color: var(--color-border-glow);
}
.pw-free-input::placeholder {
  color: var(--color-text-muted);
  opacity: 0.5;
}

.pw-free-send {
  padding: 10px 16px;
  font-size: 14px;
  background: var(--color-primary);
  color: var(--color-text-on-primary);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font-family);
  font-weight: 600;
  transition: box-shadow 0.2s;
  white-space: nowrap;
}
.pw-free-send:hover {
  box-shadow: var(--shadow-glow-primary);
}
.pw-free-send:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ---------------- 结局弹窗 ---------------- */
.pw-ending-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pwFadeIn 0.5s ease;
}

.pw-ending-modal {
  background: var(--color-surface-translucent-strong);
  backdrop-filter: blur(var(--blur-glass));
  -webkit-backdrop-filter: blur(var(--blur-glass));
  border: 1px solid var(--color-border-glow);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  text-align: center;
  max-width: 360px;
  width: 90%;
  box-shadow: var(--shadow-soft), var(--shadow-glow-accent);
}

.pw-ending-label {
  font-size: 13px;
  color: var(--color-gold);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.pw-ending-name {
  font-size: 22px;
  font-weight: 700;
  color: var(--color-text);
  margin-bottom: 16px;
}
.pw-ending-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.8;
}
.pw-ending-btn {
  padding: 10px 28px;
  font-size: 15px;
  background: var(--color-primary);
  color: var(--color-text-on-primary);
  border: none;
  border-radius: var(--radius-pill);
  cursor: pointer;
  font-family: var(--font-family);
  font-weight: 600;
  transition: box-shadow 0.2s;
}
.pw-ending-btn:hover {
  box-shadow: var(--shadow-glow-primary);
}

/* ---------------- 新建剧情弹窗 ---------------- */
.pw-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pwFadeIn 0.3s ease;
}

.pw-modal {
  background: var(--color-surface-translucent-strong);
  backdrop-filter: blur(var(--blur-glass));
  -webkit-backdrop-filter: blur(var(--blur-glass));
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 560px;
  width: 92%;
  max-height: 85vh;
  overflow-y: auto;
  scrollbar-width: none;
  box-shadow: var(--shadow-soft);
}
.pw-modal::-webkit-scrollbar { display: none; }

.pw-modal h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-primary);
  margin: 0 0 20px 0;
  text-align: center;
}

.pw-form-group {
  margin-bottom: 16px;
}
.pw-form-group label {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--color-text-muted);
  margin-bottom: 6px;
  opacity: 0.65;
}
.pw-form-group input,
.pw-form-group textarea {
  width: 100%;
  padding: 10px 14px;
  font-size: 14px;
  background: rgba(240, 248, 255, 0.06);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text);
  font-family: var(--font-family);
  outline: none;
  transition: border-color 0.2s;
  box-sizing: border-box;
}
.pw-form-group input:focus,
.pw-form-group textarea:focus {
  border-color: var(--color-border-glow);
}
.pw-form-group textarea {
  resize: vertical;
  min-height: 60px;
}
.pw-form-row {
  display: flex;
  gap: 10px;
}
.pw-form-row .pw-form-group {
  flex: 1;
}
.pw-form-section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--color-gold);
  margin: 20px 0 6px 0;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--color-border);
}
.pw-required {
  color: var(--color-gold);
  font-weight: 400;
}

/* ---- 头像行 ---- */
.pw-avatar-row {
  display: flex;
  align-items: flex-start;
  gap: 0;
  margin: 8px 0;
}
.pw-char-side {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.pw-char-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--color-border);
  box-shadow: var(--shadow-softer);
  flex-shrink: 0;
}
.pw-char-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.pw-char-avatar .avatar-fallback {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700;
}
.pw-char-side textarea {
  width: 100%;
  min-height: 60px;
  padding: 10px 12px;
  font-size: 14px;
  background: var(--color-bg-alt);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text);
  font-family: var(--font-family);
  outline: none;
  resize: vertical;
  box-sizing: border-box;
  transition: border-color 0.2s;
}
.pw-char-side textarea:focus {
  border-color: var(--color-border-glow);
}

/* ---- 连线 + 关系文字 ---- */
.pw-connection {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 28px;
  width: 80px;
  flex-shrink: 0;
}
.pw-relation-text {
  width: 100%;
  padding: 2px 0;
  background: transparent;
  border: none;
  color: var(--color-text-muted);
  font-size: 12px;
  font-family: var(--font-family);
  text-align: center;
  outline: none;
  margin-bottom: 4px;
}
.pw-relation-text:focus {
  color: var(--color-text);
}
.pw-relation-text::placeholder {
  color: var(--color-text-muted);
  opacity: 0.4;
}
.pw-connection-line {
  width: 100%;
  height: 1px;
  background: var(--color-border-strong);
}

.pw-modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  justify-content: flex-end;
}

/* ---------------- Topbar 按钮 ---------------- */
.pw-topbar-btn {
  background: none;
  border: 1px solid var(--color-border);
  color: var(--color-text);
  cursor: pointer;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: var(--font-family);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.pw-topbar-btn:hover {
  border-color: var(--color-border-glow);
  box-shadow: var(--shadow-softer);
}
.pw-topbar-btn.end-btn {
  color: var(--color-accent);
  border-color: rgba(255, 159, 192, 0.3);
}
.pw-topbar-btn.end-btn:hover {
  border-color: var(--color-accent);
  box-shadow: var(--shadow-glow-accent);
}

/* ---------------- 提示文字 ---------------- */
.pw-hint {
  font-size: 12px;
  color: var(--color-text-muted);
  opacity: 0.5;
  text-align: center;
  padding: 8px;
}

/* ---------------- 打字指示器 ---------------- */
.pw-typing {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 0;
}
.pw-typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-primary);
  animation: pwTyping 1.4s ease-in-out infinite;
}
.pw-typing-dot:nth-child(2) { animation-delay: 0.2s; }
.pw-typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pwTyping {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}
</style>

<!-- ========== 存档列表视图 ========== -->
<div id="pw-list-view" class="pw-view active">
  <div class="pw-save-list" id="pw-save-list"></div>
  <div class="pw-empty" id="pw-empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M12 2a14.5 14.5 0 0 0 0 20"></path>
      <path d="M2 12h20"></path>
    </svg>
    <p>还没有剧情存档</p>
    <p style="font-size:13px;opacity:0.4;">点击右上角 "+ 新建" 开始一段新故事</p>
  </div>
</div>

<!-- ========== 游戏视图 ========== -->
<div id="pw-game-view" class="pw-view">
  <div class="pw-game-area" id="pw-game-area"></div>
  <div class="pw-choice-panel" id="pw-choice-panel" style="display:none;">
    <div class="pw-options" id="pw-options"></div>
    <div class="pw-free-input-row">
      <input type="text" class="pw-free-input" id="pw-free-input" maxlength="500" />
      <button class="pw-free-send" id="pw-free-send">发送</button>
    </div>
    <div class="pw-hint">选择选项或自由输入来推进剧情</div>
  </div>
</div>

<!-- ========== 新建剧情弹窗 ========== -->
<div id="pw-new-modal-overlay" class="pw-modal-overlay" style="display:none;">
  <div class="pw-modal">
    <h3>新建平行世界</h3>

    <!-- 标题 -->
    <div class="pw-form-section-title">标题</div>
    <div class="pw-form-group">
      <input type="text" id="pw-new-title" maxlength="50" placeholder="给这个故事起个名字">
    </div>

    <!-- 世界观 -->
    <div class="pw-form-section-title">世界观 <span class="pw-required">*</span></div>
    <div class="pw-form-group">
      <textarea id="pw-new-world" maxlength="300" rows="2" placeholder="例如：赛博朋克都市、中世纪奇幻大陆..."></textarea>
    </div>

    <!-- 头像行 + 身份 -->
    <div class="pw-form-section-title">角色设定 <span class="pw-required">*</span></div>
    <div class="pw-avatar-row">
      <div class="pw-char-side">
        <div class="pw-char-avatar" id="pw-my-avatar"></div>
        <textarea id="pw-new-my-desc" maxlength="300" rows="2" placeholder="我的身份..."></textarea>
      </div>

      <div class="pw-connection">
        <div class="pw-connection-line"></div>
        <input type="text" class="pw-relation-text" id="pw-new-relation" maxlength="20" placeholder="关系">
      </div>

      <div class="pw-char-side">
        <div class="pw-char-avatar" id="pw-his-avatar"></div>
        <textarea id="pw-new-his-desc" maxlength="300" rows="2" placeholder="他的身份..."></textarea>
      </div>
    </div>

    <!-- 过往经历（选填） -->
    <div class="pw-form-section-title">过往经历</div>
    <div class="pw-form-group">
      <textarea id="pw-new-past" maxlength="500" rows="2" placeholder="相识的经历、共同的回忆..."></textarea>
    </div>

    <!-- 开场情境（选填） -->
    <div class="pw-form-section-title">开场情境</div>
    <div class="pw-form-group">
      <label>留空则由AI自动生成开场</label>
      <textarea id="pw-new-opening" maxlength="300"></textarea>
    </div>

    <div class="pw-modal-actions">
      <button class="btn-secondary" id="pw-new-cancel">取消</button>
      <button class="btn-primary" id="pw-new-submit">开始故事</button>
    </div>
  </div>
</div>

<!-- ========== 结局弹窗 ========== -->
<div id="pw-ending-overlay" class="pw-ending-overlay" style="display:none;">
  <div class="pw-ending-modal">
    <div class="pw-ending-icon"></div>
    <div class="pw-ending-label">剧 情 完 结</div>
    <div class="pw-ending-name" id="pw-ending-name"></div>
    <p style="font-size:14px;color:var(--color-text-muted);margin-bottom:20px;">你们的故事在这个世界告一段落。<br>但平行世界里，还有无数种可能。</p>
    <button class="pw-ending-btn" id="pw-ending-ok">返回存档列表</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/avatar.js"></script>
<script src="js/parallelWorld.js"></script>
<script src="js/nav.js?v=6"></script>
<script src="js/octopus-widget.js"></script>
<script src="js/deepsea-particles.js"></script>

</body>
