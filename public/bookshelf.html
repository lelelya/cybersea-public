/* ===== 书架卡片面板 ===== */
.bookshelf-scene {
  width: min(720px, 88vw);
  margin: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 36px;
  position: relative;
  z-index: 0;
}

/* 页面布局 */
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 页面整体背景图覆盖 */
body.bs-has-page-bg {
  background-image: var(--bs-page-bg) !important;
  background-size: cover !important;
  background-position: center !important;
}

/* 顶部行 — 两张竖向卡片并排 */
.bookshelf-row-top {
  display: flex;
  gap: 24px;
  height: 460px;
}

/* 底部行 — 两张横向宽卡上下叠放 */
.bookshelf-row-bottom {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ===== 玻璃卡片 ===== */
.bs-card {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.3s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  /* 玻璃质感 */
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(12px) saturate(120%);
  -webkit-backdrop-filter: blur(12px) saturate(120%);
  border: 1px solid rgba(255, 255, 255, 0.10);
}

/* 上排竖向卡片 */
.bs-card.card-portrait {
  flex: 1;
  height: 460px;
}

/* 下排横向宽卡 */
.bs-card.card-landscape {
  width: 100%;
  height: 130px;
}

.bs-card:hover {
  transform: scale(1.02);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.12) inset;
}

.bs-card:active {
  transform: scale(0.98);
}

/* 卡片底图遮罩 */
.bs-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(0,0,0,0.05) 0%,
    transparent 40%,
    rgba(0,0,0,0.35) 100%
  );
  z-index: 1;
  pointer-events: none;
  transition: opacity 0.3s;
}

.bs-card.has-card-bg::before {
  background: linear-gradient(180deg,
    rgba(0,0,0,0.2) 0%,
    transparent 35%,
    rgba(0,0,0,0.45) 100%
  );
}

/* 卡片单独底图 */
.bs-card-bg-img {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  z-index: 0;
  opacity: 0.7;
}

/* 对角圆角 */
.bs-card.card-tl { border-radius: 20px 0 20px 0; }
.bs-card.card-tr { border-radius: 0 20px 0 20px; }
.bs-card.card-bl { border-radius: 20px 0 20px 0; }
.bs-card.card-br { border-radius: 0 20px 0 20px; }

/* 圆角角加轻微内发光 */
.bs-card.card-tl {
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.06);
}
.bs-card.card-tr {
  box-shadow: inset -1px 1px 0 rgba(255,255,255,0.06);
}
.bs-card.card-bl {
  box-shadow: inset 1px -1px 0 rgba(255,255,255,0.06);
}
.bs-card.card-br {
  box-shadow: inset -1px -1px 0 rgba(255,255,255,0.06);
}

/* 卡片内容 */
.bs-card-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}

.bs-card-icon {
  width: 40px;
  height: 40px;
  opacity: 0.85;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}

.bs-card-label {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text);
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  letter-spacing: 2px;
}

.bs-card-status {
  font-size: 12px;
  color: var(--color-text-muted);
  text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  opacity: 0.8;
}

.bs-card-status.written { color: var(--color-primary); }
.bs-card-status.not-written { color: var(--color-text-muted); }

/* 响应式 */
@media (max-width: 420px) {
  .bookshelf-scene {
    padding: 10px;
    gap: 8px;
  }
  .bookshelf-row-top {
    height: 310px;
  }
  .bs-card.card-portrait {
    height: 310px;
  }
  .bs-card.card-landscape {
    height: 110px;
  }
  .bs-card-label { font-size: 14px; letter-spacing: 1px; }
  .bs-card-icon { width: 28px; height: 28px; }
  .bs-card-status { font-size: 11px; }
}
</style>
