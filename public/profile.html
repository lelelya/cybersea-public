<style>
  /* 昵称签名 inline 编辑 */
  #profile-name, #profile-bio-display { cursor: text; border-radius: 4px; transition: background 0.15s; }
  #profile-name:hover, #profile-bio-display:hover { background: var(--color-primary-soft); }

  .profile-inline-input {
    font-family: var(--font-family); border: none; border-bottom: 1px solid rgba(79,217,200,0.4);
    background: transparent; color: var(--color-text); outline: none; padding: 0; margin: 0;
  }

  .sh-back-btn {
    background: none; border: none; color: var(--color-text);
    cursor: pointer; padding: 4px; display: flex; align-items: center;
  }
  .sh-back-btn svg { width: 24px; height: 24px; stroke: currentColor; }

  .profile-moment-item {
    cursor: pointer; transition: all 0.2s;
    pointer-events: auto !important;
  }
  .profile-moment-item:hover {
    border-color: var(--color-primary);
    box-shadow: var(--shadow-softer);
  }

  /* 动态详情弹窗 */
  .moment-detail-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: linear-gradient(180deg, #020409 0%, #04060c 50%, #050812 100%);
    display: none; flex-direction: column;
    pointer-events: none;
  }
  .moment-detail-overlay.show { display: flex; pointer-events: auto; }
  .moment-detail-card { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .moment-detail-topbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    background: var(--color-surface-translucent); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border);
  }
  .moment-detail-body { flex: 1; overflow-y: auto; padding: 16px; }

  .moment-detail-content {
    font-size: 15px; color: var(--color-text); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; margin-bottom: 12px;
  }
  .moment-detail-img { max-width: 100%; border-radius: 12px; margin-bottom: 12px; display: block; }
  .moment-detail-time { font-size: 12px; color: var(--color-text-muted); margin-bottom: 16px; }

  .moment-detail-likes {
    padding: 10px 0; border-top: 1px solid var(--color-border);
    font-size: 13px; color: var(--color-text-muted);
  }
  .moment-detail-likes span { color: var(--color-primary); }

  .moment-detail-comments { margin-top: 12px; }
  .moment-detail-comment {
    display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .moment-comment-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--color-bg-alt); display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--color-text-muted);
  }
  .moment-comment-body { flex: 1; }
  .moment-comment-author { font-size: 12px; font-weight: 600; color: var(--color-primary); }
  .moment-comment-text { font-size: 13px; color: var(--color-text); margin-top: 2px; }
  .moment-comment-time { font-size: 11px; color: var(--color-text-muted); opacity: 0.6; margin-top: 2px; }

  .moment-detail-actions {
    display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--color-border); margin-top: 12px;
  }
  .moment-detail-actions button {
    background: none; border: 1px solid var(--color-border); border-radius: var(--radius-pill);
    color: var(--color-text-muted); padding: 6px 16px; cursor: pointer;
    font-size: 13px; font-family: var(--font-family); transition: all 0.15s;
  }
  .moment-detail-actions button:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .moment-detail-actions button.liked { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-soft); }

  .moment-detail-compose {
    display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-border);
  }
  .moment-detail-compose input {
    flex: 1; padding: 8px 12px; border-radius: var(--radius-pill);
    border: 1px solid var(--color-border); background: var(--color-bg-alt);
    color: var(--color-text); font-size: 13px; font-family: var(--font-family); outline: none;
  }
  .moment-detail-compose input:focus { border-color: var(--color-primary); }
  .moment-detail-compose button {
    background: var(--color-primary); color: var(--color-text-on-primary); border: none;
    border-radius: var(--radius-pill); padding: 8px 16px; cursor: pointer;
    font-size: 13px; font-family: var(--font-family);
  }
</style>
