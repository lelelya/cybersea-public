<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('cybersea_theme')||'deep-sea')</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>图片记录</title>
  <script src="js/shared.js"></script>
<script src="js/bgm-player.js"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/effects.css" />
<style>
  .ir-topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--color-surface-translucent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--color-border);
  }
  .ir-back-btn {
    background: none; border: none; color: var(--color-text);
    cursor: pointer; padding: 4px; display: flex; align-items: center;
  }
  .ir-back-btn svg { width: 24px; height: 24px; stroke: currentColor; }
  .ir-title { font-weight: 700; font-size: 16px; color: var(--color-text); }

  .ir-page {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .ir-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }
  .ir-item {
    position: relative;
    border-radius: var(--radius-sm);
    overflow: hidden;
    aspect-ratio: 1;
    cursor: pointer;
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    transition: all 0.2s;
  }
  .ir-item:hover {
    border-color: var(--color-primary);
    box-shadow: var(--shadow-softer);
  }
  .ir-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .ir-item .ir-role-tag {
    position: absolute;
    top: 4px; right: 4px;
    font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(0,0,0,0.6);
    color: white;
    pointer-events: none;
  }
  .ir-item .ir-role-tag.user { color: var(--color-primary); }
  .ir-item .ir-role-tag.ai { color: var(--color-accent); }

  /* 预览弹窗 */
  .ir-preview-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  .ir-preview-overlay.show { display: flex; }
  .ir-preview-img {
    max-width: 90vw; max-height: 75vh;
    border-radius: var(--radius-md);
    object-fit: contain;
  }
  .ir-preview-info {
    margin-top: 12px; font-size: 13px; color: var(--color-text-muted);
    text-align: center;
  }
  .ir-preview-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.1); border: none;
    color: white; width: 40px; height: 40px;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; transition: all 0.2s;
  }
  .ir-preview-close:hover { background: rgba(255,255,255,0.25); }

  .ir-empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 20px;
    color: var(--color-text-muted); gap: 12px; text-align: center;
  }
</style>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#050a14" />
  <link rel="stylesheet" href="css/design-system.css?v=2">
</head>
<body>
  <div class="topbar ir-topbar">
    <button class="ir-back-btn" onclick="history.back()" title="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <div class="title ir-title">图片记录</div>
  </div>

  <div class="ir-page" id="ir-page">
    <div class="ir-empty" id="ir-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" width="48" height="48" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      <div style="font-size:15px;">暂无图片记录</div>
    </div>
    <div class="ir-grid" id="ir-grid"></div>
  </div>

  <!-- 预览弹窗 -->
  <div class="ir-preview-overlay" id="ir-preview">
    <button class="ir-preview-close" id="ir-preview-close">&times;</button>
    <img class="ir-preview-img" id="ir-preview-img" src="" alt="" />
    <div class="ir-preview-info" id="ir-preview-info"></div>
  </div>

  <script src="js/imageRecords.js"></script>
  <script src="js/nav.js?v=6"></script>
</body>
</html>
