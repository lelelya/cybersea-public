<style>
.reader-scene { position:fixed; inset:0; display:flex; flex-direction:column; background:linear-gradient(180deg, #070e1a 0%, #0a1628 100%); z-index:0; }
.reader-topbar { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; backdrop-filter:blur(var(--blur-glass)); background:rgba(10,20,40,0.8); border-bottom:1px solid rgba(255,255,255,0.1); z-index:10; }
.reader-back-btn { display:flex; align-items:center; gap:4px; background:none; border:none; color:rgba(255,255,255,0.6); cursor:pointer; font-size:14px; font-family:var(--font-family); padding:4px 8px; border-radius:var(--radius-sm); transition:color 0.2s; }
.reader-back-btn:hover { color:rgba(255,255,255,0.9); }
.reader-title { font-size:16px; font-weight:600; color:rgba(255,255,255,0.9); }
#reader-view { position:fixed; inset:0; display:none; flex-direction:column; z-index:5; }
#reader-view.show { display:flex; z-index:100; }
.reader-content { flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:32px 20px 12px; }

.book-grid { width:100%; max-width:680px; margin:0 auto; padding-top:20px; display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
.book-card { position:relative; cursor:pointer; transition:transform 0.2s; }
.book-card:hover { transform:translateY(-4px); }
.book-cover { aspect-ratio:3/4; border-radius:3px 8px 8px 3px; position:relative; overflow:visible; background:rgba(255,255,255,0.06); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.1); border-right:none; box-shadow:2px 3px 10px rgba(0,0,0,0.3); }
/* 书脊立体 */
.book-cover::after { content:''; position:absolute; right:-5px; top:0; width:5px; height:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-left:none; border-radius:0 8px 8px 0; transform:skewY(2deg); transform-origin:top left; }
/* 书页侧面 */
.book-cover::before { content:''; position:absolute; right:-4px; top:3px; width:3px; height:calc(100% - 6px); background:rgba(255,255,255,0.03); border-radius:0 6px 6px 0; z-index:-1; }
.book-cover-inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 8px; border-radius:3px 8px 8px 3px; overflow:hidden; }
.book-cover-inner::before { content:''; position:absolute; left:3px; top:8px; bottom:8px; width:1px; background:rgba(255,255,255,0.06); border-radius:1px; }
.book-cover-title { font-size:16px; font-weight:600; color:rgba(255,255,255,0.85); text-align:center; line-height:1.6; word-break:break-word; overflow:hidden; max-height:4.8em; }
.book-cover-title-input { width:90%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:4px; color:rgba(255,255,255,0.9); font-size:14px; text-align:center; padding:4px; font-family:var(--font-family); outline:none; }
.book-card.dragging { opacity:0.4; }
.book-cover-meta { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:10px; color:rgba(255,255,255,0.35); }
.book-card-actions { display:flex; justify-content:center; gap:8px; margin-top:8px; opacity:0; transition:opacity 0.2s; }
.book-card:hover .book-card-actions { opacity:1; }
.book-card-act { background:none; border:none; color:rgba(255,255,255,0.5); cursor:pointer; font-size:13px; padding:2px 6px; border-radius:4px; transition:all 0.15s; }
.book-card-act:hover { color:#fff; background:rgba(255,255,255,0.1); }
.book-card-act.danger:hover { color:var(--color-danger); }
.book-card.touch-active .book-card-actions { opacity:1; }
.book-empty { text-align:center; padding:80px 20px; color:var(--color-text-muted); font-size:14px; }

.book-page { width:100%; max-width:620px; height:80vh; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:4px 14px 14px 4px; padding:40px 36px; box-shadow:0 4px 24px rgba(0,0,0,0.3); position:relative; color:rgba(255,255,255,0.85); font-size:16px; line-height:2; }

.book-page::before { content:''; position:absolute; left:0; top:0; bottom:0; width:28px; background:linear-gradient(90deg, rgba(255,255,255,0.03), transparent); border-right:1px solid rgba(255,255,255,0.06); border-radius:4px 0 0 14px; }
.book-page-inner { margin-left:16px; user-select:text; }
.book-page-inner p { text-indent:2em; margin-bottom:12px; }

.page-nav { display:flex; align-items:center; gap:16px; margin-top:20px; padding-bottom:10px; }
.page-nav-btn { width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.7); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.page-nav-btn:hover:not(:disabled) { border-color:rgba(79,217,200,0.4); box-shadow:0 0 12px rgba(79,217,200,0.2); color:#fff; }
.page-nav-btn:disabled { opacity:0.2; cursor:default; }
.page-indicator { font-size:14px; color:rgba(255,255,255,0.5); min-width:60px; text-align:center; }

.annot-mark-circle { border:2px solid #ff6b6b; border-radius:4px; padding:0 2px; cursor:pointer; position:relative; }
.annot-mark-wavy { text-decoration:underline wavy #f4d58d; text-underline-offset:4px; cursor:pointer; position:relative; }
.annot-mark-double_line { border-bottom:3px double #4fd9c8; cursor:pointer; position:relative; }
.annot-mark-single_line { border-bottom:2px solid #4fd9c8; cursor:pointer; position:relative; }

.annot-toolbar { position:fixed; display:none; background:var(--color-surface-translucent-strong); backdrop-filter:blur(20px); border:1px solid var(--color-border-strong); border-radius:var(--radius-md); padding:6px 10px; box-shadow:var(--shadow-soft); z-index:1000; gap:8px; align-items:center; }
.annot-toolbar.show { display:flex; }
.annot-toolbar-btn { background:none; border:1px solid transparent; color:var(--color-text); cursor:pointer; padding:6px 10px; border-radius:var(--radius-sm); font-size:14px; font-family:var(--font-family); transition:all 0.15s; white-space:nowrap; }
.annot-toolbar-btn:hover { background:var(--color-primary-soft); border-color:var(--color-border-glow); }
.annot-note-input-wrap { display:none; align-items:center; gap:6px; }
.annot-note-input { width:140px; padding:4px 8px; border:1px solid var(--color-border); border-radius:var(--radius-sm); background:rgba(255,255,255,0.06); color:var(--color-text); font-size:13px; font-family:var(--font-family); outline:none; }
.annot-note-input:focus { border-color:var(--color-border-glow); }

@media (max-width:600px) { .book-page { padding:24px 16px; font-size:14px; } .book-page-inner { margin-left:8px; } }
</style>

<div class="form-container" id="books-list-view" style="max-width:640px;"></div>

<!-- 视图2：阅读器 -->
<div id="reader-view">
  <div class="reader-topbar">
    <button class="reader-back-btn" id="reader-back-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>返回</span>

  </div>

    <div class="book-page" id="book-page">
      <div class="book-page-inner" id="book-page-inner"></div>
    </div>
    <div class="page-nav">
      <button class="page-nav-btn" id="page-prev" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-indicator" id="page-indicator">1 / 1</span>
      <button class="page-nav-btn" id="page-next" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>

<!-- 浮动批画工具条 -->

<!-- 添加/导入弹窗 -->
<div class="modal-overlay" id="add-book-modal" style="display:none;">

    <input class="modal-input" id="book-title-input" placeholder="书名" maxlength="50" style="width:100%;margin-bottom:8px;" />
    <input type="file" id="book-file-input" accept=".txt" style="display:block;margin-bottom:8px;color:var(--color-text);font-size:13px;" />
    <div class="settings-hint" style="margin-bottom:12px;">可选 .txt 文件，不选则创建空书</div>
    <div class="modal-actions">
      <button class="btn-ghost btn-ghost-sm" id="add-book-cancel">取消</button>
      <button class="btn-ghost btn-ghost-sm" id="add-book-confirm" style="color:var(--color-primary);">创建</button>
    </div>
  </div>
</div>
