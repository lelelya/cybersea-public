  <!-- 筛选标签 -->
  <div class="letters-tabs">
    <button class="letters-tab active" data-filter="all">全部</button>
    <button class="letters-tab" data-filter="ai">他的来信</button>
    <button class="letters-tab" data-filter="user">我的信件</button>
  </div>

  <!-- 信封列表 -->
  <div class="letters-container" id="letters-list"></div>

  <!-- 回信目标选取弹窗 -->
  <div id="reply-pick-overlay" class="modal-overlay" style="display:none;">
    <div class="write-modal" style="max-width:560px;">
      <h3 class="modal-title">选择要回复的信件</h3>
      <div class="reply-pick-list" id="reply-pick-list" style="scrollbar-width:none;max-height:60vh;"></div>
      <div class="write-actions">
        <button class="btn-secondary" id="reply-pick-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 写信弹窗 -->
  <div id="write-modal-overlay" class="write-overlay" style="display:none;">
    <!-- 信纸外的工具栏 -->
    <div class="write-toolbar">
      <span class="write-toolbar-title" id="write-modal-title">给他写信</span>
      <div class="stationery-picker" id="stationery-picker">
        <button class="stationery-option active" data-key="deep-blue">深海蓝</button>
        <button class="stationery-option" data-key="starry-abyss">星空蓝</button>
      </div>
    </div>
    <!-- 信纸 -->
    <div class="write-modal stationery-deep-blue" id="write-modal-card">
      <input type="text" id="write-title" class="write-input-title" placeholder="标题（选填）" maxlength="100" />
      <div class="write-area" id="write-area">
        <textarea id="write-content" placeholder="在这里写下你想说的话...&#10;&#10;每一个字都会穿过深海，抵达TA的心里。"></textarea>
      </div>
    </div>
    <!-- 翻页控制 -->
    <div class="write-pager" id="write-pager" style="visibility:hidden;">
      <button class="pager-btn" id="page-prev">‹ 上一页</button>
      <span class="pager-info" id="page-info">第1页</span>
      <button class="pager-btn" id="page-next">下一页 ›</button>
    </div>
    <!-- 信纸外的操作按钮 -->
    <div class="write-actions">
      <button class="btn-secondary" id="write-cancel">取消</button>
      <button class="btn-primary" id="write-send">发送信件</button>
    </div>
  </div>

  <!-- 信件详情弹窗 -->
  <div id="letter-detail-overlay" class="modal-overlay" style="display:none;">
    <div class="letter-detail" id="letter-detail">
      <!-- 动态填充 -->
    </div>
  </div>

  <div class="toast" id="toast"></div>
