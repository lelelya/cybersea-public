  /* 聊天页三点菜单 */
  .chat-menu-wrap { position: relative; }
  .chat-menu-btn {
    background: none; border: none; color: var(--color-text-muted);
    cursor: pointer; padding: 4px; display: flex; align-items: center;
    justify-content: center; border-radius: var(--radius-sm); transition: all 0.2s;
  }
  .chat-menu-btn:hover { color: var(--color-text); background: var(--color-primary-soft); }
  .chat-menu-dropdown {
    position: fixed; min-width: 150px;
    background: var(--color-surface-translucent-strong);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
    padding: 6px; display: none; flex-direction: column; gap: 2px;
    z-index: 9999; box-shadow: var(--shadow-soft);
  }
  .chat-menu-dropdown.show { display: flex; }
  .chat-menu-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius-sm); color: var(--color-text);
    text-decoration: none; font-size: 14px; font-family: var(--font-family);
    transition: all 0.15s;
  }
  .chat-menu-item:hover { background: var(--color-primary-soft); color: var(--color-primary); }
  .chat-menu-item svg { width: 18px; height: 18px; flex-shrink: 0; }

/* 备注编辑铅笔图标 */
#chat-remark-btn {
  cursor: pointer; opacity: 0.7; flex-shrink: 0;
  color: var(--color-text-muted); transition: opacity 0.2s;
}
#chat-remark-btn:hover { opacity: 1; color: var(--color-primary); }

/* 备注内联编辑输入框 */
#chat-remark-input {
  font-size: 16px; font-weight: 700; color: var(--color-text);
  background: transparent; border: none; border-bottom: 1px solid rgba(79, 217, 200, 0.3);
  outline: none; font-family: var(--font-family); padding: 0; width: 120px;
}

  <script>
  (function() {
    var btn = document.getElementById('chat-menu-btn');
    var dropdown = document.getElementById('chat-menu-dropdown');
    if (btn && dropdown) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var rect = btn.getBoundingClientRect();
        dropdown.style.top = (rect.bottom + 6) + 'px';
        dropdown.style.right = (window.innerWidth - rect.right) + 'px';
        dropdown.classList.toggle('show');
      });
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.chat-menu-wrap') && !e.target.closest('.chat-menu-dropdown')) {
          dropdown.classList.remove('show');
        }
      });
      window.addEventListener('resize', function() {
        dropdown.classList.remove('show');
      });
    }
  })();
  </script>

<script>
// Service Worker 注册 + Web Push 订阅
(function() {
  if (!('serviceWorker' in navigator)) return;

  // 注册 sw.js
  navigator.serviceWorker.register('/sw.js').catch(function() {});

  // WebSocket 主动消息处理
  function handleProactiveMsg(msg) {
    if (!msg || !msg.message) return;
    // 调用 chat.js 的渲染逻辑（如果页面在聊天视图）
    if (typeof renderProactiveMessage === 'function') {
      renderProactiveMessage(msg.message);
    }
  }

  // 等 wsClient 就绪后注册监听
  var checkWs = setInterval(function() {
    if (window.wsClient && window.wsClient.on) {
      clearInterval(checkWs);
      window.wsClient.on('proactive_message', handleProactiveMsg);
    }
  }, 500);
})();
</script>
